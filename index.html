<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Dayline</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dayline">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b0b0a">
<link rel="apple-touch-icon" id="touchicon" href="">
<style>
:root{
  --desk:#b9b5aa;
  --desk2:#a9a599;
  --panel:#e8e5dc;
  --panel-hi:#f5f3ec;
  --panel-lo:#cdc9bd;
  --ink:#24221e;
  --ink2:#7d786c;
  --rail:#dcd8cc;
  --rail-lo:#c6c2b5;
  --bezel:#d3cfc3;
  --work:rgba(245,176,35,.62);
  --sun:rgba(255,255,255,.9);
  --past:rgba(45,40,30,.42);
  --tick:rgba(0,0,0,.30);
  --tick2:rgba(0,0,0,.12);
  --accent:#e4550e;
  --lcd:#d9d9c3;
  --lcd-lo:#c4c4ac;
  --shadow:rgba(0,0,0,.38);
  --hi:rgba(255,255,255,.75);
}
html[data-dk]{
  --desk:#0a0a09;
  --desk2:#050505;
  --panel:#2b2a27;
  --panel-hi:#3a3935;
  --panel-lo:#1f1e1c;
  --ink:#ece8dc;
  --ink2:#8d887b;
  --rail:#1b1a18;
  --rail-lo:#121110;
  --bezel:#242321;
  --work:rgba(226,156,30,.62);
  --sun:rgba(255,214,120,.55);
  --past:rgba(0,0,0,.58);
  --tick:rgba(255,255,255,.34);
  --tick2:rgba(255,255,255,.13);
  --accent:#ff6a1f;
  --lcd:#1a1a14;
  --lcd-lo:#10100c;
  --shadow:rgba(0,0,0,.7);
  --hi:rgba(255,255,255,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#000}
body{
  position:fixed;top:0;left:0;right:0;bottom:0;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--ink);
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
.desk{
  position:absolute;top:0;left:0;right:0;bottom:0;
  padding:3.2vmin;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 1px,transparent 1px,transparent 3px),
    radial-gradient(ellipse at 30% 20%,var(--desk),var(--desk2));
  transition:background-color .6s;
}
.panel{
  position:relative;height:100%;
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
  padding:4vmin 4.4vmin 3.6vmin;
  border-radius:4.2vmin;
  background:linear-gradient(155deg,var(--panel-hi) 0%,var(--panel) 38%,var(--panel-lo) 100%);
  box-shadow:
    inset 0 1.5px 0 var(--hi),
    inset 0 -2px 3px rgba(0,0,0,.14),
    inset 1px 0 0 rgba(255,255,255,.12),
    0 1px 1px rgba(0,0,0,.5),
    0 1.6vmin 3.6vmin var(--shadow),
    0 .4vmin .8vmin rgba(0,0,0,.35);
}
/* header */
.head{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-flex-shrink:0;flex-shrink:0}
.clock{margin-right:3vmin;position:relative;cursor:pointer}
.tag{position:absolute;right:0;bottom:0;padding:.7vmin 1.8vmin;border-radius:1.4vmin;font-size:2.3vmin;font-weight:700;letter-spacing:.2em;color:#fff;background:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 .4vmin .8vmin rgba(0,0,0,.35);opacity:0;-webkit-transition:opacity .35s;transition:opacity .35s;pointer-events:none}
.tag.on{opacity:1}
.time{font-size:15vmin;line-height:1;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 1px 0 var(--hi)}
.colon{display:inline-block;padding:0 .02em;position:relative;top:-.04em;-webkit-transition:opacity .25s;transition:opacity .25s}
.colon.off{opacity:.18}
.date{margin-top:.6vmin;margin-left:.8vmin;font-size:2.5vmin;letter-spacing:.22em;font-weight:500;color:var(--ink2)}

.lcd{
  -webkit-flex:1;flex:1;min-width:38vmin;margin-right:3.4vmin;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
  padding:2.2vmin 3vmin;border-radius:2.2vmin;
  background:linear-gradient(180deg,var(--lcd-lo),var(--lcd) 40%);
  box-shadow:inset 0 .5vmin 1.2vmin rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.25),0 1px 0 var(--hi),0 0 0 .7vmin var(--bezel),0 0 0 .9vmin rgba(0,0,0,.14);
  position:relative;overflow:hidden;
}
.lcd:after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0));pointer-events:none}
html[data-dk] .lcd:after{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0))}
.led{width:1.7vmin;height:1.7vmin;border-radius:50%;margin-right:2.4vmin;-webkit-flex-shrink:0;flex-shrink:0;
  background:radial-gradient(circle at 35% 30%,#8a5a45,#4a2a1e);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 1px 0 var(--hi);-webkit-transition:all .4s;transition:all .4s}
.led.on{background:radial-gradient(circle at 35% 30%,#ffd2a8,var(--accent) 60%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 0 1.6vmin 2px var(--accent)}
.lcdtxt{-webkit-flex:1;flex:1}
.lab{font-size:2.2vmin;letter-spacing:.24em;font-weight:600;color:var(--ink2)}
.val{font-size:10.5vmin;line-height:1.05;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink)}
html[data-dk] .val{color:#ffb070;text-shadow:0 0 1.6vmin rgba(255,120,30,.4)}
.pct{position:absolute;top:2.2vmin;right:3vmin;font-size:3.6vmin;font-weight:500;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--ink2)}

/* switch */
.sw{
  position:relative;width:30vmin;height:10vmin;border:0;padding:0;margin:0;border-radius:2.6vmin;
  font-family:inherit;color:var(--ink);-webkit-appearance:none;appearance:none;outline:none;-webkit-flex-shrink:0;flex-shrink:0;
  background:linear-gradient(180deg,var(--rail-lo),var(--rail));
  box-shadow:inset 0 .6vmin 1.3vmin rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.2),0 1px 0 var(--hi),0 0 0 .7vmin var(--bezel),0 0 0 .9vmin rgba(0,0,0,.14);
}
.thumb{
  position:absolute;top:.8vmin;bottom:.8vmin;left:.8vmin;width:calc(50% - .8vmin);border-radius:1.9vmin;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel) 55%,var(--panel-lo));
  box-shadow:inset 0 1.5px 0 var(--hi),inset 0 -1px 2px rgba(0,0,0,.18),0 .5vmin 1vmin rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);
  -webkit-transition:-webkit-transform .35s cubic-bezier(.3,1.25,.5,1),transform .35s cubic-bezier(.3,1.25,.5,1);
  transition:transform .35s cubic-bezier(.3,1.25,.5,1);
}
.thumb:after{content:"";position:absolute;left:22%;right:22%;top:22%;bottom:22%;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0,rgba(0,0,0,.16) 1px,transparent 1px,transparent 4px);opacity:.55;border-radius:3px}
.sw.work .thumb{-webkit-transform:translateX(100%);transform:translateX(100%)}
.swl{position:absolute;top:0;bottom:0;width:50%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  font-size:2.7vmin;font-weight:700;letter-spacing:.16em;z-index:2;color:var(--ink2);-webkit-transition:color .3s;transition:color .3s}
.swl.a{left:0}.swl.b{right:0}
.sw:not(.work) .swl.a,.sw.work .swl.b{color:var(--accent);text-shadow:0 1px 0 var(--hi)}
.sw:active .thumb{box-shadow:inset 0 1.5px 0 var(--hi),inset 0 -1px 2px rgba(0,0,0,.18),0 .2vmin .5vmin rgba(0,0,0,.45)}

/* stage */
.stage{-webkit-flex:1;flex:1;position:relative;min-height:0;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:0 1.5vmin}
.gauge{position:relative}
.h .gauge{width:100%;height:44vmin}
.v .gauge{height:100%;width:100%;max-height:100%}

.rail,.tray{position:absolute}
.h .rail,.h .tray{left:0;right:0;top:0;height:62%}
.v .rail,.v .tray{top:0;bottom:0;left:0;width:68%}
.rail{
  overflow:hidden;border-radius:3vmin;
  background:linear-gradient(180deg,var(--rail-lo),var(--rail) 30%,var(--rail));
  box-shadow:inset 0 .8vmin 1.8vmin rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.25),
    0 0 0 1vmin var(--bezel),0 0 0 1.2vmin rgba(0,0,0,.16),0 1.2vmin 1.8vmin 1vmin rgba(0,0,0,.18),0 .25vmin 0 1.2vmin var(--hi);
}
.v .rail{background:linear-gradient(90deg,var(--rail-lo),var(--rail) 30%,var(--rail))}
.rail:after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 42%,rgba(0,0,0,.06))}
.v .rail:after{background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0) 42%,rgba(0,0,0,.06))}
html[data-dk] .rail:after{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%)}
html[data-dk] .v .rail:after{background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%)}

.seg{position:absolute;-webkit-transition:left .7s cubic-bezier(.5,0,.2,1),width .7s cubic-bezier(.5,0,.2,1),top .7s cubic-bezier(.5,0,.2,1),height .7s cubic-bezier(.5,0,.2,1),opacity .5s;transition:left .7s cubic-bezier(.5,0,.2,1),width .7s cubic-bezier(.5,0,.2,1),top .7s cubic-bezier(.5,0,.2,1),height .7s cubic-bezier(.5,0,.2,1),opacity .5s}
.nt .seg{-webkit-transition:none;transition:none}
.h .seg{top:0;bottom:0}
.v .seg{left:0;right:0}
.work{background:var(--work);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.sun{background:var(--sun)}
.h .sun{bottom:auto;height:.9vmin;top:0}
.v .sun{right:auto;width:.9vmin;left:0}
.past{background:var(--past)}
.tick{position:absolute;background:var(--tick);-webkit-transition:left .7s cubic-bezier(.5,0,.2,1),top .7s cubic-bezier(.5,0,.2,1),opacity .5s;transition:left .7s cubic-bezier(.5,0,.2,1),top .7s cubic-bezier(.5,0,.2,1),opacity .5s}
.nt .tick{-webkit-transition:none;transition:none}
.h .tick{top:0;bottom:0;width:1px;margin-left:-.5px}
.v .tick{left:0;right:0;height:1px;margin-top:-.5px}
.tick.half{background:var(--tick2)}
.h .tick.maj{top:0;bottom:0}

/* needle */
.needle{position:absolute;background:var(--accent);-webkit-transition:left .7s cubic-bezier(.5,0,.2,1),top .7s cubic-bezier(.5,0,.2,1),opacity .5s;transition:left .7s cubic-bezier(.5,0,.2,1),top .7s cubic-bezier(.5,0,.2,1),opacity .5s;
  box-shadow:0 0 0 1px rgba(0,0,0,.18),.5vmin .5vmin 1vmin rgba(0,0,0,.4)}
.nt .needle{-webkit-transition:none;transition:none}
.needle.out{opacity:.5}
.h .needle{top:-2.2vmin;bottom:-2.2vmin;width:.7vmin;margin-left:-.35vmin;border-radius:.4vmin}
.v .needle{left:-2.2vmin;right:-2.2vmin;height:.7vmin;margin-top:-.35vmin;border-radius:.4vmin}
.cap{position:absolute;background:linear-gradient(180deg,#ff8a4a,var(--accent) 60%,#b83f08);border-radius:1.2vmin;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 .6vmin 1vmin rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.25)}
.h .cap{left:-1.6vmin;right:-1.6vmin;height:3.2vmin;top:-2.6vmin}
.h .cap.b{top:auto;bottom:-2.6vmin}
.v .cap{top:-1.6vmin;bottom:-1.6vmin;width:3.2vmin;left:-2.6vmin}
.v .cap.b{left:auto;right:-2.6vmin}

/* scale labels */
.scale{position:absolute}
.h .scale{left:0;right:0;top:62%;height:38%;padding-top:3.4vmin}
.v .scale{top:0;bottom:0;left:68%;width:32%}
.sl{position:absolute;font-size:3.6vmin;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--ink2);white-space:nowrap;
  -webkit-transition:left .7s cubic-bezier(.5,0,.2,1),top .7s cubic-bezier(.5,0,.2,1),opacity .5s;transition:left .7s cubic-bezier(.5,0,.2,1),top .7s cubic-bezier(.5,0,.2,1),opacity .5s;text-shadow:0 1px 0 var(--hi)}
.nt .sl{-webkit-transition:none;transition:none}
.h .sl{top:4.8vmin;-webkit-transform:translateX(-50%);transform:translateX(-50%)}
.v .sl{left:7vmin;-webkit-transform:translateY(-50%);transform:translateY(-50%)}
.dense .sl{font-size:2.7vmin;letter-spacing:0}
.v .sl{font-size:3.1vmin}
.v .dense .sl{font-size:2.7vmin}
.sl.now{color:var(--accent);font-weight:700}

/* settings */
.knob{z-index:3;position:absolute;right:2.6vmin;bottom:2.6vmin;width:7vmin;height:7vmin;padding:1.5vmin;border:0;border-radius:50%;color:var(--ink2);-webkit-appearance:none;appearance:none;outline:none;
  background:linear-gradient(160deg,var(--panel-hi),var(--panel) 50%,var(--panel-lo));
  box-shadow:inset 0 1.5px 0 var(--hi),0 .5vmin 1vmin rgba(0,0,0,.4),0 0 0 .6vmin var(--bezel),0 0 0 .8vmin rgba(0,0,0,.12)}
.knob:active{box-shadow:inset 0 .4vmin .9vmin rgba(0,0,0,.4),0 0 0 .6vmin var(--bezel),0 0 0 .8vmin rgba(0,0,0,.12)}
.sheet{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:4.2vmin;z-index:5;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  background:rgba(0,0,0,.42);opacity:0;pointer-events:none;-webkit-transition:opacity .3s;transition:opacity .3s}
.sheet.on{opacity:1;pointer-events:auto}
.card{width:92%;max-width:130vmin;padding:4vmin 3.4vmin 3.4vmin;border-radius:3.4vmin;
  background:linear-gradient(155deg,var(--panel-hi),var(--panel) 45%,var(--panel-lo));
  box-shadow:inset 0 1.5px 0 var(--hi),0 2vmin 5vmin rgba(0,0,0,.55),0 .5vmin 1vmin rgba(0,0,0,.4);
  -webkit-transform:translateY(2vmin);transform:translateY(2vmin);-webkit-transition:-webkit-transform .3s,transform .3s;transition:transform .3s}
.sheet.on .card{-webkit-transform:none;transform:none}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:3.4vmin}
.rl{width:13vmin;font-size:2.6vmin;font-weight:700;letter-spacing:.2em;color:var(--ink2)}
.pair{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:flex-end;justify-content:flex-end}
.dash{width:3vmin;height:.5vmin;margin:0 1.6vmin;border-radius:1px;background:var(--ink2)}
.step{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.step output{display:block;width:15vmin;margin:0 1.4vmin;padding:1.5vmin 0;text-align:center;font-size:5.6vmin;font-weight:300;font-variant-numeric:tabular-nums;color:var(--ink);border-radius:1.6vmin;
  background:linear-gradient(180deg,var(--lcd-lo),var(--lcd) 40%);box-shadow:inset 0 .4vmin 1vmin rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.25),0 1px 0 var(--hi)}
html[data-dk] .step output{color:#ffb070}
.step b{display:block;width:9vmin;height:9vmin;border-radius:50%;text-align:center;font-weight:400;font-size:6vmin;line-height:8.6vmin;color:var(--ink);cursor:pointer;
  background:linear-gradient(160deg,var(--panel-hi),var(--panel) 50%,var(--panel-lo));
  box-shadow:inset 0 1.5px 0 var(--hi),0 .5vmin 1vmin rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.12)}
.step b.p{box-shadow:inset 0 .4vmin .9vmin rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.12)}
.ok{display:block;margin:1vmin auto 0;width:30vmin;height:9.5vmin;border:0;border-radius:2.4vmin;font-family:inherit;font-size:3vmin;font-weight:700;letter-spacing:.2em;color:#fff;-webkit-appearance:none;appearance:none;outline:none;
  background:linear-gradient(180deg,#ff8a4a,var(--accent) 60%,#b83f08);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 .6vmin 1.2vmin rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.25)}
.ok:active{box-shadow:inset 0 .5vmin 1vmin rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.25)}
.v .rl{width:12.5vmin;letter-spacing:.1em;font-size:2.3vmin}
.v .step output{width:14.5vmin;font-size:4.2vmin;padding:1.8vmin 0}
.v .step b{width:8vmin;height:8vmin;line-height:7.6vmin}
.v .dash{margin:0 1vmin;width:2vmin}
.v .step output{margin:0 1vmin}

/* portrait */
.v .head{-webkit-align-items:flex-start;align-items:flex-start}
.v .clock{margin-right:0}
.v .sw{margin-left:auto;-webkit-align-self:center;align-self:center}
.v .lcd{-webkit-flex:none;flex:none;width:100%;margin:5vmin 0 0;-webkit-order:3;order:3}
.v .val{font-size:12vmin}
.v .stage{margin-top:6vmin;padding:0 1.5vmin 1vmin}
.v .time{font-size:17vmin}
</style>
</head>
<body>
<div class="desk"><div class="panel" id="panel">

  <div class="head">
    <div class="clock" id="clock">
      <div class="time"><span id="hh">00</span><span class="colon" id="colon">:</span><span id="mm">00</span></div>
      <div class="date" id="date"></div>
      <div class="tag" id="tag"></div>
    </div>
    <div class="lcd">
      <i class="led" id="led"></i>
      <div class="lcdtxt"><div class="lab" id="lab">LEFT</div><div class="val" id="val">0:00</div></div>
      <div class="pct" id="pct"></div>
    </div>
    <button class="sw" id="sw" type="button" aria-label="Day / Work">
      <span class="thumb"></span>
      <span class="swl a">DAY</span><span class="swl b">WORK</span>
    </button>
  </div>

  <button class="knob" id="gear" type="button" aria-label="Set day">
    <svg viewBox="0 0 24 24" width="100%" height="100%"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></g><g fill="var(--panel)" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="6" r="2.4"/><circle cx="16" cy="12" r="2.4"/><circle cx="10" cy="18" r="2.4"/></g></svg>
  </button>
  <div class="sheet" id="sheet"><div class="card">
    <div class="row"><span class="rl">DAY</span><span id="st-d"></span></div>
    <div class="row"><span class="rl">WORK</span><span id="st-w"></span></div>
    <button class="ok" id="ok" type="button">OK</button>
  </div></div>

  <div class="stage"><div class="gauge" id="gauge">
    <div class="rail" id="rail">
      <div class="seg work" id="work"></div>
      <div class="seg sun" id="sunband"></div>
      <div id="ticks"></div>
      <div class="seg past" id="past"></div>
    </div>
    <div class="tray" id="tray"><div class="needle" id="needle"><i class="cap"></i><i class="cap b"></i></div></div>
    <div class="scale" id="scale"></div>
  </div></div>
</div></div>

<script>
(function () {
  var DS = 6, DE = 23, WS = 8, WE = 17;   // my day / working day (hours, 0.5 steps)
  try {
    var saved = JSON.parse(localStorage.getItem('dayline-times') || 'null');
    if (saved && saved.length === 4 && saved[1] - saved[0] >= 1 && saved[3] - saved[2] >= 1 &&
        saved[0] >= 0 && saved[1] <= 24 && saved[2] >= 0 && saved[3] <= 24) { DS = saved[0]; DE = saved[1]; WS = saved[2]; WE = saved[3]; }
  } catch (e) {}
  var LAT = 51.5, LON = -0.12;   // UK (London) for sunrise / sunset
  var mode = 'day';
  try { if (localStorage.getItem('dayline-mode') === 'work') mode = 'work'; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var gauge = $('gauge'), ticksEl = $('ticks'), scaleEl = $('scale');
  var workEl = $('work'), sunEl = $('sunband'), pastEl = $('past'), needle = $('needle');
  var sw = $('sw');
  var vertical = false;

  /* ---------- sun ---------- */
  function sunTimes(date, lat, lon) {
    var rad = Math.PI / 180, dayMs = 86400000, J1970 = 2440588, J2000 = 2451545, J0 = 0.0009;
    var e = rad * 23.4397;
    var lw = rad * -lon, phi = rad * lat;
    var d = (new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12).valueOf() / dayMs - 0.5 + J1970) - J2000;
    var n = Math.round(d - J0 - lw / (2 * Math.PI));
    var ds = J0 + (0 + lw) / (2 * Math.PI) + n;
    var M = rad * (357.5291 + 0.98560028 * ds);
    var C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    var L = M + C + rad * 102.9372 + Math.PI;
    var dec = Math.asin(Math.sin(e) * Math.sin(L));
    var Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
    var h = -0.833 * rad;
    var cosw = (Math.sin(h) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
    cosw = Math.max(-1, Math.min(1, cosw));
    var w = Math.acos(cosw);
    var a = J0 + (w + lw) / (2 * Math.PI) + n;
    var Jset = J2000 + a + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
    var Jrise = Jnoon - (Jset - Jnoon);
    function toH(j) { var t = new Date((j + 0.5 - J1970) * dayMs); return t.getHours() + t.getMinutes() / 60; }
    return { rise: toH(Jrise), set: toH(Jset) };
  }
  var sunCache = { key: '', v: { rise: 7, set: 19 } };
  function sun(now) {
    var k = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();
    if (k !== sunCache.key) { sunCache = { key: k, v: sunTimes(now, LAT, LON) }; }
    return sunCache.v;
  }

  /* ---------- theme ---------- */
  var mqDark = null, systemTheme = false;
  try {
    if (window.matchMedia) {
      mqDark = window.matchMedia('(prefers-color-scheme: dark)');
      var mqLight = window.matchMedia('(prefers-color-scheme: light)');
      systemTheme = !!(mqDark.matches || mqLight.matches);
    }
  } catch (e) { systemTheme = false; }

  var themePref = 'auto';
  try { var tp = localStorage.getItem('dayline-theme'); if (tp === 'light' || tp === 'dark') themePref = tp; } catch (e) {}

  function applyTheme(now) {
    var dark;
    if (themePref !== 'auto') { dark = themePref === 'dark'; }
    else if (systemTheme) { dark = mqDark.matches; }
    else {
      var s = sun(now), h = now.getHours() + now.getMinutes() / 60;
      dark = h < s.rise || h >= s.set;
    }
    if (dark) root.setAttribute('data-dk', '1'); else root.removeAttribute('data-dk');
  }
  if (systemTheme) {
    var onTheme = function () { applyTheme(new Date()); };
    if (mqDark.addEventListener) mqDark.addEventListener('change', onTheme);
    else if (mqDark.addListener) mqDark.addListener(onTheme);
  }

  /* ---------- placement ---------- */
  function range() { return mode === 'work' ? [WS, WE] : [DS, DE]; }
  function pos(h, r) { return (h - r[0]) / (r[1] - r[0]) * 100; }
  function place(el, start, size) {
    var s = el.style;
    if (vertical) {
      s.top = start + '%'; s.left = ''; s.width = '';
      if (size !== null) s.height = size + '%'; else s.height = '';
    } else {
      s.left = start + '%'; s.top = ''; s.height = '';
      if (size !== null) s.width = size + '%'; else s.width = '';
    }
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // build ticks + labels
  var ticks = [], labels = [];
  (function () {
    var i, t, l;
    for (i = 0; i <= 48; i++) {
      t = document.createElement('i');
      t.className = 'tick' + (i % 2 ? ' half' : ' maj');
      ticksEl.appendChild(t); ticks.push(t);
    }
    for (i = 0; i <= 24; i++) {
      l = document.createElement('div');
      l.className = 'sl';
      l.textContent = pad(i);
      scaleEl.appendChild(l); labels.push(l);
    }
  })();

  function layout() {
    var r = range(), i, p, hr, show;
    var span = r[1] - r[0];
    scaleEl.className = 'scale' + (span > 18 ? ' dense' : '');
    var sunT = sun(new Date());
    place(workEl, pos(WS, r), pos(WE, r) - pos(WS, r));
    place(sunEl, pos(sunT.rise, r), pos(sunT.set, r) - pos(sunT.rise, r));
    for (i = 0; i <= 48; i++) {
      hr = i / 2; p = pos(hr, r);
      show = p >= -0.01 && p <= 100.01 && (span <= 12 || i % 2 === 0);
      place(ticks[i], p, null);
      ticks[i].style.opacity = show ? 1 : 0;
    }
    for (i = 0; i <= 24; i++) {
      p = pos(i, r);
      show = p >= -0.01 && p <= 100.01 && true;
      place(labels[i], p, null);
      labels[i].style.opacity = show ? 1 : 0;
    }
  }

  /* ---------- per-second update ---------- */
  var lastMin = -1;
  function update() {
    var now = new Date();
    var hh = now.getHours(), mm = now.getMinutes(), ss = now.getSeconds();
    var h = hh + mm / 60 + ss / 3600;
    var r = range();

    $('colon').className = 'colon' + (ss % 2 ? ' off' : '');
    if (mm !== lastMin) {
      lastMin = mm;
      $('hh').textContent = pad(hh);
      $('mm').textContent = pad(mm);
      var D = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      var M = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
      $('date').textContent = D[now.getDay()] + ' ' + now.getDate() + ' ' + M[now.getMonth()];
      applyTheme(now);
      var inWork = h >= WS && h < WE;
      $('led').className = 'led' + (inWork ? ' on' : '');
    }

    var p = pos(h, r), pc = Math.max(0, Math.min(100, p));
    place(pastEl, 0, pc);
    place(needle, pc, null);
    needle.className = 'needle' + (p < 0 || p > 100 ? ' out' : '');

    var total = r[1] - r[0], label, left, pctTxt;
    if (h < r[0]) { label = 'START'; left = r[0] - h; pctTxt = ''; }
    else if (h >= r[1]) { label = 'DONE'; left = 0; pctTxt = '0%'; }
    else { label = 'LEFT'; left = r[1] - h; pctTxt = Math.round(left / total * 100) + '%'; }
    var mins = Math.ceil(left * 60 - 1e-6);
    $('lab').textContent = label;
    $('val').textContent = Math.floor(mins / 60) + ':' + pad(mins % 60);
    $('pct').textContent = pctTxt;

    // highlight the current hour label
    var cur = Math.floor(h), i;
    for (i = 0; i <= 24; i++) labels[i].className = 'sl' + (r[1] - r[0] <= 12 && i === cur ? ' now' : '');
  }

  /* ---------- orientation ---------- */
  function setClass(nt) {
    var c = (vertical ? 'v' : 'h') + (nt ? ' nt' : '');
    root.className = c; document.body.className = c;
  }
  function orient() {
    vertical = window.innerHeight > window.innerWidth;
    setClass(true);
    layout(); update();
    void gauge.offsetWidth;
    setTimeout(function () { setClass(false); }, 60);
  }
  window.addEventListener('resize', orient);
  window.addEventListener('orientationchange', function () { setTimeout(orient, 120); });

  /* ---------- toggle ---------- */
  function setMode(m) {
    mode = m;
    sw.className = 'sw' + (mode === 'work' ? ' work' : '');
    try { localStorage.setItem('dayline-mode', mode); } catch (e) {}
    layout(); update();
  }
  sw.addEventListener('click', function () { setMode(mode === 'work' ? 'day' : 'work'); });

  /* ---------- set my day ---------- */
  function fmt(h) { var m = Math.round(h * 60); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  var vals = { ds: 0, de: 0, ws: 0, we: 0 }, outs = {};
  function readVals() { vals.ds = DS; vals.de = DE; vals.ws = WS; vals.we = WE; }
  function adjust(key, d) {
    var v = vals[key] + d * 0.5;
    if (key === 'ds') v = Math.max(0, Math.min(vals.de - 1, v));
    if (key === 'de') v = Math.min(24, Math.max(vals.ds + 1, v));
    if (key === 'ws') v = Math.max(0, Math.min(vals.we - 1, v));
    if (key === 'we') v = Math.min(24, Math.max(vals.ws + 1, v));
    if (v === vals[key]) return;
    vals[key] = v;
    DS = vals.ds; DE = vals.de; WS = vals.ws; WE = vals.we;
    outs[key].textContent = fmt(v);
    try { localStorage.setItem('dayline-times', JSON.stringify([DS, DE, WS, WE])); } catch (e) {}
    layout(); update();
  }
  function hold(btn, fn) {
    var t1 = 0, t2 = 0;
    function stop() { btn.className = ''; clearTimeout(t1); clearInterval(t2); }
    function start(e) { e.preventDefault(); stop(); btn.className = 'p'; fn(); t1 = setTimeout(function () { t2 = setInterval(fn, 90); }, 420); }
    btn.addEventListener('touchstart', start);
    btn.addEventListener('touchend', stop); btn.addEventListener('touchcancel', stop);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', stop); btn.addEventListener('mouseleave', stop);
  }
  function stepper(key) {
    var w = document.createElement('div'); w.className = 'step';
    var minus = document.createElement('b'), plus = document.createElement('b'), o = document.createElement('output');
    minus.textContent = '\u2212'; plus.textContent = '+';
    w.appendChild(minus); w.appendChild(o); w.appendChild(plus);
    outs[key] = o;
    hold(minus, function () { adjust(key, -1); });
    hold(plus, function () { adjust(key, 1); });
    return w;
  }
  function buildRow(id, a, b) {
    var host = $(id), pair = document.createElement('span'), dash = document.createElement('i');
    pair.className = 'pair'; dash.className = 'dash';
    pair.appendChild(stepper(a)); pair.appendChild(dash); pair.appendChild(stepper(b));
    host.parentNode.replaceChild(pair, host);
  }
  buildRow('st-d', 'ds', 'de'); buildRow('st-w', 'ws', 'we');
  var sheet = $('sheet');
  $('gear').addEventListener('click', function () {
    readVals();
    outs.ds.textContent = fmt(DS); outs.de.textContent = fmt(DE); outs.ws.textContent = fmt(WS); outs.we.textContent = fmt(WE);
    sheet.className = 'sheet on';
  });
  $('ok').addEventListener('click', function () { sheet.className = 'sheet'; });
  sheet.addEventListener('click', function (e) { if (e.target === sheet) sheet.className = 'sheet'; });

  /* ---------- tap time: auto / light / dark ---------- */
  var tagEl = $('tag'), tagTimer = 0;
  $('clock').addEventListener('click', function () {
    themePref = themePref === 'auto' ? 'light' : (themePref === 'light' ? 'dark' : 'auto');
    try { if (themePref === 'auto') localStorage.removeItem('dayline-theme'); else localStorage.setItem('dayline-theme', themePref); } catch (e) {}
    applyTheme(new Date());
    tagEl.textContent = themePref === 'auto' ? 'AUTO' : themePref === 'dark' ? 'DARK' : 'LIGHT';
    tagEl.className = 'tag on';
    clearTimeout(tagTimer);
    tagTimer = setTimeout(function () { tagEl.className = 'tag'; }, 1600);
  });

  /* ---------- no scroll / zoom ---------- */
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  /* ---------- home-screen icon ---------- */
  try {
    var c = document.createElement('canvas'); c.width = c.height = 180;
    var g = c.getContext('2d');
    g.fillStyle = '#2b2a27'; g.fillRect(0, 0, 180, 180);
    function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
    rr(18, 62, 144, 56, 14); g.fillStyle = '#1b1a18'; g.fill();
    rr(86, 62, 76, 56, 14); g.fillStyle = 'rgba(214,146,26,.6)'; g.fill();
    g.fillStyle = '#e8e5dc'; for (var k = 0; k < 7; k++) { g.fillRect(30 + k * 20, 108, 2, 10); }
    rr(64, 46, 12, 88, 5); g.fillStyle = '#ff6a1f'; g.fill();
    $('touchicon').setAttribute('href', c.toDataURL('image/png'));
  } catch (e) {}

  /* ---------- go ---------- */
  sw.className = 'sw' + (mode === 'work' ? ' work' : '');
  applyTheme(new Date());
  orient();
  setInterval(function () { update(); }, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { applyTheme(new Date()); layout(); update(); } });
})();
</script>
</body>
</html>
